name: "Hairspring deterministic tests"
description: "Explore targets for property violations; upload SARIF annotations and replayable bundles."
author: "Hairspring contributors"
branding:
  icon: "search"
  color: "orange"

inputs:
  targets:
    description: "Space-separated target names (default: all targets in hairspring.toml)"
    required: false
    default: ""
  seed:
    description: "Exploration seed. Empty = random (the seed is printed so failures can be reproduced)."
    required: false
    default: ""
  config:
    description: "Path to hairspring.toml"
    required: false
    default: "hairspring.toml"
  hairspring-bin:
    description: "Path to the hairspring executable. Build or download it in an earlier step."
    required: false
    default: "hairspring"
  upload-sarif:
    description: "Upload findings as code-scanning alerts (needs security-events: write)"
    required: false
    default: "true"

outputs:
  exit-code:
    description: "0 = all properties held, 1 = a violation was found, 2 = error"
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - name: Run hairspring
      id: run
      shell: bash
      env:
        INPUT_TARGETS: ${{ inputs.targets }}
        INPUT_SEED: ${{ inputs.seed }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_BIN: ${{ inputs.hairspring-bin }}
      run: |
        # Inputs arrive through the environment, never interpolated into the script, so a hostile
        # target name or seed cannot inject shell commands.
        set +e
        args=(test)
        read -r -a targets <<< "$INPUT_TARGETS"
        [ ${#targets[@]} -gt 0 ] && args+=("${targets[@]}")
        [ -n "$INPUT_SEED" ] && args+=(--seed "$INPUT_SEED")
        args+=(--config "$INPUT_CONFIG" --db .hairspring/hairspring.db --bundle-dir .hairspring/bundles)
        "$INPUT_BIN" "${args[@]}" --format sarif > hairspring.sarif
        code=$?
        "$INPUT_BIN" "${args[@]}" --format junit > hairspring-junit.xml 2>/dev/null || true
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upload findings to code scanning
      if: ${{ inputs.upload-sarif == 'true' && always() }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: hairspring.sarif
        category: hairspring

    - name: Upload reproduction bundles and reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hairspring-results
        path: |
          .hairspring/bundles/
          hairspring.sarif
          hairspring-junit.xml
        if-no-files-found: ignore

    - name: Fail if a property was violated
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.exit-code }}
      run: |
        if [ "$CODE" != "0" ]; then
          echo "hairspring exited with $CODE (1 = property violated, 2 = error). Replay with: hairspring replay <bundle>"
          exit 1
        fi
