[package]
name = "anthill-store"
version = "0.1.0"
edition = "2021"
description = "Anthill persistence: runs, failures, blobs, job queue and events (SQLite; Postgres behind a feature)"
license = "Apache-2.0"

[dependencies]
postgres = { version = "0.19.14", optional = true }
r2d2 = { version = "0.8.10", optional = true }
r2d2_postgres = { version = "0.18.2", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"

[features]
# PostgreSQL backend for multi-worker deployments (plain TCP: use a private network or a TLS proxy).
postgres = ["dep:postgres", "dep:r2d2", "dep:r2d2_postgres"]
