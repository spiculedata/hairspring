[package]
name = "anthill-service"
version = "0.1.0"
edition = "2021"
description = "Anthill service layer: runs, jobs, results and replay on top of the store and engine"
license = "Apache-2.0"

[dependencies]
anthill-core = { path = "../anthill-core" }
anthill-engine = { path = "../anthill-engine" }
anthill-store = { path = "../anthill-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
