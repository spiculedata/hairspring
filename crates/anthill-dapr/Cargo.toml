[package]
name = "anthill-dapr"
version = "0.1.0"
edition = "2021"
description = "Simulated Dapr sidecar for Anthill: seeded faults for pub/sub and state, runnable under Hermit"
license = "Apache-2.0"

[lib]
name = "anthill_dapr"
path = "src/lib.rs"

[[bin]]
name = "anthill-dapr-sim"
path = "src/bin/anthill-dapr-sim.rs"

[dependencies]
anthill-core = { path = "../anthill-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
