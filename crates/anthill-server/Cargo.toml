[package]
name = "anthill-server"
version = "0.1.0"
edition = "2021"
description = "Anthill server: REST API, SSE, MCP endpoint, auth and embedded web UI"
license = "Apache-2.0"

[dependencies]
anthill-core = { path = "../anthill-core" }
anthill-engine = { path = "../anthill-engine" }
anthill-mcp = { path = "../anthill-mcp" }
anthill-service = { path = "../anthill-service" }
anthill-store = { path = "../anthill-store" }
axum = "0.8.9"
futures-util = "0.3.34"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }

[dev-dependencies]
anthill-worker = { path = "../anthill-worker" }
serde_json = "1.0.154"
ureq = "3.4.2"
