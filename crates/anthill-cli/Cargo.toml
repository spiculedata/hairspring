[package]
name = "anthill-cli"
version = "0.1.0"
edition = "2021"
description = "The `anthill` command line: test, replay, doctor, results"
license = "Apache-2.0"

[lib]
name = "anthill_cli"
path = "src/lib.rs"

[[bin]]
name = "anthill"
path = "src/bin/anthill.rs"

[dependencies]
anthill-core = { path = "../anthill-core" }
anthill-engine = { path = "../anthill-engine" }
anthill-service = { path = "../anthill-service" }
anthill-store = { path = "../anthill-store", features = ["postgres"] }
anthill-hermit = { path = "../anthill-hermit" }
anthill-mcp = { path = "../anthill-mcp" }
anthill-server = { path = "../anthill-server" }
anthill-wasm = { path = "../anthill-wasm" }
anthill-worker = { path = "../anthill-worker" }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
serde_json = "1.0.154"
ureq = "3.4.2"
