[package]
name = "anthill-cli"
version = "0.1.0"
edition = "2021"
description = "The `anthill` command line: test, replay, doctor, results"
license = "Apache-2.0"

[lib]
name = "anthill_cli"
path = "src/lib.rs"

[[bin]]
name = "anthill"
path = "src/bin/anthill.rs"

[dependencies]
anthill-core = { path = "../anthill-core" }
anthill-engine = { path = "../anthill-engine" }
anthill-service = { path = "../anthill-service" }
anthill-store = { path = "../anthill-store" }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
