[package]
name = "hairspring-service"
version = "0.1.0"
edition = "2021"
description = "Hairspring service layer: runs, jobs, results and replay on top of the store and engine"
license = "Apache-2.0"

[dependencies]
hairspring-core = { path = "../hairspring-core" }
hairspring-engine = { path = "../hairspring-engine" }
hairspring-store = { path = "../hairspring-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
