[package]
name = "anthill-worker"
version = "0.1.0"
edition = "2021"
description = "Remote worker for Anthill: pulls jobs from a server, runs them locally, reports results"
license = "Apache-2.0"

[dependencies]
anthill-engine = { path = "../anthill-engine" }
anthill-service = { path = "../anthill-service" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.4.2"
