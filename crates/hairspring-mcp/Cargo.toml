[package]
name = "hairspring-mcp"
version = "0.1.0"
edition = "2021"
description = "Model Context Protocol server for Hairspring: lets agents run, inspect and replay explorations"
license = "Apache-2.0"

[dependencies]
hairspring-core = { path = "../hairspring-core" }
hairspring-engine = { path = "../hairspring-engine" }
hairspring-service = { path = "../hairspring-service" }
hairspring-store = { path = "../hairspring-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
hairspring-props = { path = "../hairspring-props" }
