[package]
name = "anthill-mcp"
version = "0.1.0"
edition = "2021"
description = "Model Context Protocol server for Anthill: lets agents run, inspect and replay explorations"
license = "Apache-2.0"

[dependencies]
anthill-core = { path = "../anthill-core" }
anthill-engine = { path = "../anthill-engine" }
anthill-service = { path = "../anthill-service" }
anthill-store = { path = "../anthill-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
