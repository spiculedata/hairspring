[package]
name = "hairspring-dapr"
version = "0.1.0"
edition = "2021"
description = "Simulated Dapr sidecar for Hairspring: seeded faults for pub/sub and state, runnable under Hermit"
license = "Apache-2.0"

[lib]
name = "hairspring_dapr"
path = "src/lib.rs"

[[bin]]
name = "hairspring-dapr-sim"
path = "src/bin/hairspring-dapr-sim.rs"

[dependencies]
hairspring-core = { path = "../hairspring-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
