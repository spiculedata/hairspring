[package]
name = "hairspring-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly backend for Hairspring: deterministic, portable, snapshot/fork-able execution (macOS and Linux)"
license = "Apache-2.0"

[dependencies]
hairspring-core = { path = "../hairspring-core" }
hairspring-engine = { path = "../hairspring-engine" }
wasmtime = { version = "49.0.5", default-features = false, features = ["cranelift", "runtime", "wat", "std"] }
