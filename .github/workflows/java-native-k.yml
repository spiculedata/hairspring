name: Java native K

# Manual only: the Java fixture's native runs at a chosen K (iterations per worker) and JVM flag profile, so a recorded
# run shows how often the planted race fires. Profile a-prime runs make at-extra-native (profiles-extra.tsv); profile a runs
# make at-profile-native (profiles.tsv: arms a and b), and the summary reports arm a alone. The JDK is the same pinned Temurin as the java build record in ci.yml (a script test keeps them equal).
# No secrets. It can be dispatched once this file is on the default branch.
on:
  workflow_dispatch:
    inputs:
      at_k:
        description: Iterations per worker (1 to 5000)
        default: "50"
        required: false
        type: string
      runs:
        description: Runs of each mode (1 to 200)
        default: "50"
        required: false
        type: string
      profile:
        description: JVM flag profile (a-prime is profiles-extra.tsv; a runs profiles.tsv, and the log also holds b)
        default: a-prime
        required: false
        type: choice
        options:
          - a-prime
          - a

permissions:
  contents: read

jobs:
  java-native-k:
    name: Java fixture native runs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # The inputs are checked before any other step uses them: digits only, no leading zero, in range.
      # Later steps read the checked values from this step's outputs, never from the raw inputs.
      - name: Check the inputs
        id: inputs
        env:
          AT_K: ${{ inputs.at_k }}
          RUNS: ${{ inputs.runs }}
          PROFILE: ${{ inputs.profile }}
        run: |
          check() { # check <name> <value> <max>
            case "$2" in
              "" | *[!0-9]* | 0*) echo "$1='$2' is not a number from 1 to $3 (digits only, no leading zero)" >&2; exit 1 ;;
            esac
            [ "${#2}" -le 4 ] && [ "$2" -le "$3" ] || { echo "$1='$2' is above $3" >&2; exit 1; }
          }
          check at_k "$AT_K" 5000
          check runs "$RUNS" 200
          case "$PROFILE" in a-prime | a) ;; *) echo "profile='$PROFILE' is not a-prime or a" >&2; exit 1 ;; esac
          printf 'at_k=%s\nruns=%s\nprofile=%s\n' "$AT_K" "$RUNS" "$PROFILE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.12+101.0.LTS"
      - name: Build the fixture
        run: make -C examples/language-fixtures/java at-jar
      - name: Native runs
        id: native
        env:
          AT_K: ${{ steps.inputs.outputs.at_k }}
          RUNS: ${{ steps.inputs.outputs.runs }}
          PROFILE: ${{ steps.inputs.outputs.profile }}
        run: |
          set -o pipefail
          case "$PROFILE" in
            a-prime) target=at-extra-native ;;
            a) target=at-profile-native ;;
            *) echo "unknown profile $PROFILE" >&2; exit 1 ;;
          esac
          java -version 2>&1 | tee "$RUNNER_TEMP/java-native-k.log"
          taskset -c 1-3 nice -n 10 make -C examples/language-fixtures/java "$target" AT_K="$AT_K" RUNS="$RUNS" 2>&1 | tee -a "$RUNNER_TEMP/java-native-k.log"
      - name: Summary
        if: always()
        env:
          AT_K: ${{ steps.inputs.outputs.at_k }}
          PROFILE: ${{ steps.inputs.outputs.profile }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: |
          case "$NATIVE_OUTCOME" in
            success | failure) ;;
            *) echo "RUN FAILED (native runs: ${NATIVE_OUTCOME:-not run}). This is not a result." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0 ;;
          esac
          summary=$(sh examples/language-fixtures/scripts/summarize-at-native.sh "$RUNNER_TEMP/java-native-k.log" "$AT_K" "$PROFILE") || { echo "RUN FAILED: the log has no valid summary line. This is not a result." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          line="$summary (make self-check: $NATIVE_OUTCOME)"
          echo "$line"
          {
            echo "### Java fixture, native buggy runs"
            echo '```'
            echo "$line"
            grep "^FAIL" "$RUNNER_TEMP/java-native-k.log" || true
            echo '```'
            if [ "$NATIVE_OUTCOME" != success ]; then
              echo "fired=0 is a result. The make failure is the self-check's own rule (for example the buggy mode never fired); the FAIL lines above say which."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-native-k-${{ steps.inputs.outputs.profile }}-${{ steps.inputs.outputs.at_k }}
          path: ${{ runner.temp }}/java-native-k.log
          if-no-files-found: warn
          retention-days: 90
