name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --no-fail-fast
      # System-level (Hermit) tests need performance counters and are run separately on bare metal:
      #   HAIRSPRING_HERMIT_REAL=1 cargo test -p hairspring-hermit --test real_hermit

  c-sdk:
    name: C SDK (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
    defaults:
      run:
        working-directory: sdks/c
    steps:
      - uses: actions/checkout@v4
      - name: Compiler versions
        run: ${{ matrix.cc }} --version && ${{ matrix.cxx }} --version
      # Includes audit-control, the positive control for the call-site audit, and the seccomp no-syscall test.
      - name: Test
        run: make test CC=${{ matrix.cc }}
      # Compiler-specific placement behaviour for C++ call sites in files that mix inline and ordinary functions;
      # not part of make test.
      - name: C++ mixed inline and ordinary call sites
        run: make cxx-mixed CC=${{ matrix.cc }}
      - name: Signal reports under ThreadSanitizer
        run: make tsan-signals CC=${{ matrix.cc }}
      - name: Signal reports under AddressSanitizer and UBSan
        run: make asan-signals CC=${{ matrix.cc }}

  rust-sdk:
    name: Rust SDK (release, fat LTO)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The debug run is part of the `rust` job above. This one checks the linker-collected catalog with optimisation,
      # LTO and section garbage collection, and runs the seccomp "no system call, no allocation" check and the planted
      # race natively on x86-64 Linux.
      - name: Test
        run: cargo test -p hairspring-sdk --locked --release

  go-example:
    name: Go example
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache: false
      - name: Vet
        run: go vet ./...
        working-directory: examples/go-sql-cancel
      - name: Test
        run: go test ./...
        working-directory: examples/go-sql-cancel
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # With HS_REQUIRE_GO set, a missing or too old Go fails these tests instead of skipping them. The positive
      # control's SQLCANCEL_EXPECT check is not run here.
      - name: Conformance tests against the Go shim and workload
        run: cargo test -p hairspring-props --test go_shim --test go_sqlcancel
        env:
          HS_REQUIRE_GO: "1"

  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache: false
      - name: Vet
        run: go vet ./... && go vet -tags hs_violation_only ./...
        working-directory: sdks/go
      - name: Test
        run: go test -race -count=1 ./...
        working-directory: sdks/go
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # With HS_REQUIRE_GO set, a missing or too old Go fails these tests instead of skipping them.
      - name: Conformance tests against the Go SDK
        run: cargo test -p hairspring-props --test go_sdk
        env:
          HS_REQUIRE_GO: "1"

  language-fixtures:
    name: Language fixtures (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: C gcc, dir: c, args: CC=gcc }
          - { name: C clang, dir: c, args: CC=clang }
          - { name: C++ clang++, dir: cpp, args: CXX=clang++ }
          - { name: C++ g++, dir: cpp, args: CXX=g++ }
          - { name: Go, dir: go, args: "" }
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.dir == 'go'
        with:
          go-version: 1.24.x
          cache: false
      # Native checks only: the racy program must lose an update at least once in 50 runs and the locked twin never.
      - name: Build and self-check
        run: make -C examples/language-fixtures/${{ matrix.dir }} test ${{ matrix.args }}

  glibc-condlock-example:
    name: glibc condlock example (unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Unit tests only. `make test` in this example is macOS-only (see its README).
      - name: Unit tests
        run: make -C examples/glibc-condlock unit

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit
      - run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev
        working-directory: web
