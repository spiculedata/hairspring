name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --no-fail-fast
      # System-level (Hermit) tests need performance counters and are run separately on bare metal:
      #   HAIRSPRING_HERMIT_REAL=1 cargo test -p hairspring-hermit --test real_hermit

  c-sdk:
    name: C SDK (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
    defaults:
      run:
        working-directory: sdks/c
    steps:
      - uses: actions/checkout@v4
      - name: Compiler versions
        run: ${{ matrix.cc }} --version && ${{ matrix.cxx }} --version
      # Includes audit-control, the positive control for the call-site audit, and the seccomp no-syscall test.
      - name: Test
        run: make test CC=${{ matrix.cc }}
      # Compiler-specific placement behaviour for C++ call sites in files that mix inline and ordinary functions;
      # not part of make test.
      - name: C++ mixed inline and ordinary call sites
        run: make cxx-mixed CC=${{ matrix.cc }}
      - name: Signal reports under ThreadSanitizer
        run: make tsan-signals CC=${{ matrix.cc }}
      - name: Signal reports under AddressSanitizer and UBSan
        run: make asan-signals CC=${{ matrix.cc }}

  rust-sdk:
    name: Rust SDK (release, fat LTO)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The debug run is part of the `rust` job above. This one checks the linker-collected catalog with optimisation,
      # LTO and section garbage collection, and runs the seccomp "no system call, no allocation" check and the planted
      # race natively on x86-64 Linux.
      - name: Test
        run: cargo test -p hairspring-sdk --locked --release

  go-example:
    name: Go example
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache: false
      - name: Vet
        run: go vet ./...
        working-directory: examples/go-sql-cancel
      - name: Test
        run: go test ./...
        working-directory: examples/go-sql-cancel
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # With HS_REQUIRE_GO set, a missing or too old Go fails these tests instead of skipping them. The positive
      # control's SQLCANCEL_EXPECT check is not run here.
      - name: Conformance tests against the Go shim and workload
        run: cargo test -p hairspring-props --test go_shim --test go_sqlcancel
        env:
          HS_REQUIRE_GO: "1"

  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache: false
      - name: Vet
        run: go vet ./... && go vet -tags hs_violation_only ./...
        working-directory: sdks/go
      - name: Test
        run: go test -race -count=1 ./...
        working-directory: sdks/go
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # With HS_REQUIRE_GO set, a missing or too old Go fails these tests instead of skipping them.
      - name: Conformance tests against the Go SDK
        run: cargo test -p hairspring-props --test go_sdk
        env:
          HS_REQUIRE_GO: "1"

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        run: python3 --version
      # Standard library only: unit tests, and the sample programs run as real processes.
      - name: Test
        run: python3 -m unittest discover -s sdks/python/tests -t sdks/python -v
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # With HS_REQUIRE_PYTHON set, a missing or too old Python fails these tests instead of skipping them.
      - name: Conformance tests against the Python SDK
        run: cargo test -p hairspring-props --test python_sdk
        env:
          HS_REQUIRE_PYTHON: "1"

  java-sdk:
    name: Java SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Any JDK 21: the unit tests and the sample programs do not check a hash.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Version
        run: java -version
      # JDK classes only, no framework: the self-test, and the sample programs run as real processes.
      - name: Test
        run: make -C sdks/java test
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # With HS_REQUIRE_JAVA set, a missing or too old JDK fails these tests instead of skipping them.
      - name: Conformance tests against the Java SDK
        run: cargo test -p hairspring-props --test java_sdk
        env:
          HS_REQUIRE_JAVA: "1"

  language-fixtures:
    name: Language fixtures (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: C gcc, dir: c, args: CC=gcc }
          - { name: C clang, dir: c, args: CC=clang }
          - { name: C++ clang++, dir: cpp, args: CXX=clang++ }
          - { name: C++ g++, dir: cpp, args: CXX=g++ }
          - { name: Go, dir: go, args: "" }
          - { name: Python, dir: python, args: "" }
          - { name: Java, dir: java, args: "" }
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      # The hosted runners have several CPUs; a single-CPU "skipped" result must not pass here.
      LANG_AT_REQUIRE_PARALLEL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.dir == 'go'
        with:
          go-version: 1.24.x
          cache: false
      - uses: actions/setup-python@v5
        if: matrix.dir == 'python'
        with:
          python-version: "3.12"
      # Any JDK 21: the self-test and native tests do not check a hash (the pinned build is the manual record's job).
      - uses: actions/setup-java@v4
        if: matrix.dir == 'java'
        with:
          distribution: temurin
          java-version: "21"
      # The check scripts, against a fake program (once, not per compiler).
      - name: Script tests
        if: matrix.name == 'C gcc'
        run: make -C examples/language-fixtures test-scripts
      # Native checks only: one program per language. Its buggy mode must lose an update at least once in 50 runs,
      # its fixed mode never, and its wide mode must follow the same output contract.
      - name: Build and self-check
        run: make -C examples/language-fixtures/${{ matrix.dir }} test ${{ matrix.dir == 'java' && 'flags at-test' || '' }} ${{ matrix.args }}
      # Go only: the race detector (needs cgo) finds no data race in the fixture.
      - name: Race detector
        if: matrix.dir == 'go'
        run: make -C examples/language-fixtures/go test-race

  # Build records for the artifacts that are pinned for the acceptance run. B3 (seccomp) and B5 (strace) need a native
  # x86-64 Linux host, which an emulated container is not, so the records are produced here. Manual only.
  # Each job uploads the record and, next to it, the artifact it describes (the binary, or the staged Python package,
  # with a SHA256SUMS file): the record states the sha256 of exactly those bytes. The Rust variant covers at-rust;
  # the rust-probe variant covers probe-rust, the std-only probe program; the java-probe variant covers lang-at.jar, the
  # JDK-only probe program; the java variant covers lang-at.jar of the Java fixture (the Java SDK shaded in); the
  # dotnet-probe variant covers probe-dotnet (LangAtProbe.dll with its runtimeconfig.json and deps.json), built with the
  # pinned .NET SDK.
  fixture-build-records:
    name: Fixture build record (${{ matrix.variant }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [c, cxx-clang, cxx-gxx, go, python, rust, rust-probe, java-probe, java, dotnet-probe]
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.variant == 'go'
        with:
          go-version: 1.27.3
          cache: false
      - uses: actions/setup-python@v5
        if: matrix.variant == 'python'
        with:
          python-version: "3.12"
      # Python and Java run the SDK's conformance tests against the reference parser, which needs cargo.
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.variant == 'python' || matrix.variant == 'java'
      # The pinned Rust toolchain and the static musl target of the artifact.
      - uses: dtolnay/rust-toolchain@1.99.1
        if: matrix.variant == 'rust' || matrix.variant == 'rust-probe'
        with:
          targets: x86_64-unknown-linux-musl
      # The pinned Temurin 21 JDK of the Java probe and the Java fixture (the record fails if the JDK is not the pinned build).
      - uses: actions/setup-java@v4
        if: matrix.variant == 'java-probe' || matrix.variant == 'java'
        with:
          distribution: temurin
          java-version: "21.0.12+101.0.LTS"
      # The .NET SDK that ships runtime 10.0.13, so the record's version checks pass.
      - uses: actions/setup-dotnet@v4
        if: matrix.variant == 'dotnet-probe'
        with:
          dotnet-version: 10.0.402
      - name: Install the toolchains
        if: matrix.variant != 'go' && matrix.variant != 'python' && matrix.variant != 'rust' && matrix.variant != 'rust-probe' && matrix.variant != 'java-probe' && matrix.variant != 'java' && matrix.variant != 'dotnet-probe'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-13 g++-13 clang-18 strace binutils
      - name: Install strace
        if: matrix.variant == 'go' || matrix.variant == 'python' || matrix.variant == 'rust' || matrix.variant == 'rust-probe' || matrix.variant == 'java-probe' || matrix.variant == 'java' || matrix.variant == 'dotnet-probe'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace binutils file unzip
      # Python has no compiler: the record stages the package (fixture, probe and SDK) twice and compares file hashes.
      - name: Build record (Python)
        if: matrix.variant == 'python'
        env:
          PRODUCER: GitHub Actions ubuntu-24.04 (native x86-64)
          ARTIFACT_DIR: ${{ runner.temp }}/artifact
        run: IMAGE_DIGEST="runner image $ImageOS $ImageVersion (no digest available)" sh examples/language-fixtures/scripts/build-record-python.sh "$RUNNER_TEMP/record-python.md"
      # probe-rust, the std-only probe program, built twice for the static musl target.
      - name: Build record (Rust probe)
        if: matrix.variant == 'rust-probe'
        env:
          PRODUCER: GitHub Actions ubuntu-24.04 (native x86-64)
          ARTIFACT_DIR: ${{ runner.temp }}/artifact
        run: IMAGE_DIGEST="runner image $ImageOS $ImageVersion (no digest available)" sh examples/language-fixtures/scripts/build-record-probe-rust.sh "$RUNNER_TEMP/record-rust-probe.md"
      # lang-at.jar, the JDK-only probe program, built twice with the pinned JDK.
      - name: Build record (Java probe)
        if: matrix.variant == 'java-probe'
        env:
          PRODUCER: GitHub Actions ubuntu-24.04 (native x86-64)
          ARTIFACT_DIR: ${{ runner.temp }}/artifact
        run: IMAGE_DIGEST="runner image $ImageOS $ImageVersion (no digest available)" sh examples/language-fixtures/scripts/build-record-probe-java.sh "$RUNNER_TEMP/record-java-probe.md"
      # lang-at.jar of the Java fixture (the Java SDK shaded in), built twice with the pinned JDK.
      - name: Build record (Java)
        if: matrix.variant == 'java'
        env:
          PRODUCER: GitHub Actions ubuntu-24.04 (native x86-64)
          ARTIFACT_DIR: ${{ runner.temp }}/artifact
        run: IMAGE_DIGEST="runner image $ImageOS $ImageVersion (no digest available)" sh examples/language-fixtures/scripts/build-record-java.sh "$RUNNER_TEMP/record-java.md"
      # probe-dotnet, published twice from two copies of the sources.
      - name: Build record (.NET probe)
        if: matrix.variant == 'dotnet-probe'
        env:
          PRODUCER: GitHub Actions ubuntu-24.04 (native x86-64)
          ARTIFACT_DIR: ${{ runner.temp }}/artifact
        run: IMAGE_DIGEST="runner image $ImageOS $ImageVersion (no digest available)" sh examples/language-fixtures/scripts/build-record-probe-dotnet.sh "$RUNNER_TEMP/record-dotnet-probe.md"
      # at-rust, built twice for the static musl target.
      - name: Build record (Rust)
        if: matrix.variant == 'rust'
        env:
          PRODUCER: GitHub Actions ubuntu-24.04 (native x86-64)
          ARTIFACT_DIR: ${{ runner.temp }}/artifact
        run: IMAGE_DIGEST="runner image $ImageOS $ImageVersion (no digest available)" sh examples/language-fixtures/scripts/build-record-rust.sh "$RUNNER_TEMP/record-rust.md"
      - name: Build record
        if: matrix.variant != 'python' && matrix.variant != 'rust' && matrix.variant != 'rust-probe' && matrix.variant != 'java-probe' && matrix.variant != 'java' && matrix.variant != 'dotnet-probe'
        env:
          PRODUCER: GitHub Actions ubuntu-24.04 (native x86-64)
          ARTIFACT_DIR: ${{ runner.temp }}/artifact
        run: IMAGE_DIGEST="runner image $ImageOS $ImageVersion (no digest available)" sh examples/language-fixtures/scripts/build-record.sh ${{ matrix.variant }} "$RUNNER_TEMP/record-${{ matrix.variant }}.md"
      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-record-${{ matrix.variant }}
          path: ${{ runner.temp }}/record-${{ matrix.variant }}.md
          if-no-files-found: error
          retention-days: 90
      # The artifact the record describes, byte for byte, with its SHA256SUMS. The record states these bytes' sha256.
      - name: Upload the artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-${{ matrix.variant }}
          path: ${{ runner.temp }}/artifact
          if-no-files-found: error
          retention-days: 90
      # A separate step from the build: download what was just uploaded, recompute the sha256 of the downloaded bytes and
      # compare it with SHA256SUMS and with the record. The result goes into the job summary.
      - name: Download the uploaded artifact
        uses: actions/download-artifact@v4
        with:
          name: fixture-${{ matrix.variant }}
          path: ${{ runner.temp }}/downloaded
      - name: Verify the artifact as downloaded
        run: |
          rc=0
          sh examples/language-fixtures/scripts/verify-download.sh "$RUNNER_TEMP/downloaded" "$RUNNER_TEMP/record-${{ matrix.variant }}.md" > "$RUNNER_TEMP/verify.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/verify.txt"
          { echo "### Artifact as downloaded: ${{ matrix.variant }}"; echo '```'; cat "$RUNNER_TEMP/verify.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  glibc-condlock-example:
    name: glibc condlock example (unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Unit tests only. `make test` in this example is macOS-only (see its README).
      - name: Unit tests
        run: make -C examples/glibc-condlock unit

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit
      - run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev
        working-directory: web
