name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --no-fail-fast
      # System-level (Hermit) tests need performance counters and are run separately on bare metal:
      #   HAIRSPRING_HERMIT_REAL=1 cargo test -p hairspring-hermit --test real_hermit

  c-sdk:
    name: C SDK (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
    defaults:
      run:
        working-directory: sdks/c
    steps:
      - uses: actions/checkout@v4
      - name: Compiler versions
        run: ${{ matrix.cc }} --version && ${{ matrix.cxx }} --version
      # Includes audit-control, the positive control for the call-site audit, and the seccomp no-syscall test.
      - name: Test
        run: make test CC=${{ matrix.cc }}
      # Compiler-specific placement behaviour for C++ call sites in files that mix inline and ordinary functions;
      # not part of make test.
      - name: C++ mixed inline and ordinary call sites
        run: make cxx-mixed CC=${{ matrix.cc }}
      - name: Signal reports under ThreadSanitizer
        run: make tsan-signals CC=${{ matrix.cc }}
      - name: Signal reports under AddressSanitizer and UBSan
        run: make asan-signals CC=${{ matrix.cc }}

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit
      - run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev
        working-directory: web
