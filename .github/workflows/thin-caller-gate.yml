name: thin-caller-gate

# Static drift check of this repository's acceptance-spec wiring (see acceptance/README.md). It is
# deliberately NOT part of ci.yml: it must not feed the `ci` aggregate, shadow `ci`, or make a docs-only PR wait.
# It runs on pull_request only (the gate refuses every other event) and always reports: a PR that touches
# neither .github/workflows/ nor acceptance/ gets a clean `skipped` verdict without scanning.
#
# REPORT mode: findings are warnings and the job stays green; read the `verdict` in the job summary. It is
# not a required check and gates nothing. Switch to `mode: enforce` only after it has stayed clean for a
# while, and only then think about asking for it in review.
#
# PIN. Same full commit SHA as acceptance-pin-health.yml (the gate itself reports a drift when callers differ;
# scripts/tests/acceptance-wiring.test.mjs also checks it). Bump all of them together, in one pull request.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: thin-caller-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  thin-caller-gate:
    uses: spiculedata/acceptance-spec/.github/workflows/thin-caller-gate.yml@e1ee02261986f510ca3be97f09b07546dd0614be # v1 acceptance-spec@e1ee022
    with:
      mode: report
      # No allow-local-scripts: this repository keeps no local copy of any shared script, so there is nothing to
      # excuse. Do not add an entry without a one-line reason.
