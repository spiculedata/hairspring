name: Coverage gate

# Fails when coverage of the web UI or of the Rust workspace drops below the thresholds in
# .coverage-thresholds.json (a ratchet: raise the numbers as coverage grows, never lower them). The
# thresholds were set a few points below what was measured (see "rationale" in that file).
#
# Components:
#   web      Vitest with the v8 provider over web/src, excluding test files. Gated.
#   scripts  Node's built-in coverage over scripts/tests. Reported, not gated.
#   rust     cargo-llvm-cov over the whole workspace. Gated on workspace line coverage, with the
#            per-crate line numbers written to the job summary next to it. As heavy as the Rust job
#            of ci.yml, so it runs on ubuntu-24.04 with a Swatinem/rust-cache entry; the toolchain
#            and cargo-llvm-cov are what the manual report-only job used before it was gated.
#
# Advisory in the same way as the other add-on workflows: `ci` does not depend on it, and the
# `ci-feedback` workflow comments on a pull request when it is red. The coverage provider is installed
# with --no-save at the exact version of the installed vitest, so package.json and the lockfile are
# untouched.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coverage-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: coverage gate (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: |
          npm ci
          npm install --no-save "@vitest/coverage-v8@$(node -p "require('vitest/package.json').version")"

      - name: Run tests with coverage
        working-directory: web
        run: >-
          npx vitest run --coverage --coverage.provider=v8
          --coverage.reporter=json --coverage.reporter=json-summary --coverage.reporter=text
          --coverage.include='src/**'
          --coverage.exclude='src/**/*.test.ts' --coverage.exclude='src/**/*.test.tsx'

      - name: Enforce thresholds
        run: node scripts/check-coverage.mjs --component web --summary web/coverage/coverage-summary.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: |
            web/coverage/coverage-summary.json
            web/coverage/coverage-final.json
          if-no-files-found: warn
          retention-days: 14

  scripts:
    name: coverage report (scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Run tests with coverage
        run: node --test --experimental-test-coverage "scripts/tests/*.test.mjs" | tee coverage-scripts.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-scripts
          path: coverage-scripts.txt
          if-no-files-found: warn
          retention-days: 14

  rust:
    name: coverage gate (rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (stable, with llvm-tools)
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov

      - name: Run the workspace tests with coverage
        run: cargo llvm-cov --workspace --no-fail-fast --json --summary-only --output-path coverage-rust.json

      - name: Enforce thresholds
        run: node scripts/check-coverage.mjs --component rust --summary coverage-rust.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: coverage-rust.json
          if-no-files-found: warn
          retention-days: 14
